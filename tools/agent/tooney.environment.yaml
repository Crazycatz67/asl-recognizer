# Sandbox tooney runs in. Environments are reusable across agents.
# Also consumable by the `ant` CLI:
#   ant beta:environments create < tooney.environment.yaml

name: tooney-env
config:
  type: cloud
  # Unrestricted egress so web_fetch can check the deployed GitHub Pages site.
  # Switch to `limited` + allowed_hosts only if you want egress control.
  networking:
    type: unrestricted
